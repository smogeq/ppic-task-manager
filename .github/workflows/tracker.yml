# Activity 9: when a pull request is merged, mark its linked issues as done.
#
# The slides move the card with a curl call to the Projects (classic) REST API.
# GitHub shut that API down on 1 April 2025, so this version comments on and
# closes the linked issue instead. Your project board's built-in workflow
# ("Item closed" -> Status: Done, on by default) then moves the card to Done.
name: GitHub Projects Automation

on:
  pull_request:
    types: [ closed ]

permissions:
  issues: write
  pull-requests: read

jobs:
  move-issue-to-done:
    runs-on: ubuntu-latest
    # Only run when the PR was merged, not when it was closed without merging.
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark linked issues as done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Find "Closes #12", "Fixes #12" or "Resolves #12" in the PR description.
          ISSUES=$(echo "$PR_BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -u || true)

          if [ -z "$ISSUES" ]; then
            echo "No linked issues found in PR #$PR_NUMBER"
            exit 0
          fi

          for n in $ISSUES; do
            gh issue comment "$n" --repo "$REPO" --body "Done: PR #$PR_NUMBER was merged (moved by tracker.yml)."
            gh issue close "$n" --repo "$REPO" || echo "Issue #$n was already closed"
            echo "Issue #$n marked as done"
          done
